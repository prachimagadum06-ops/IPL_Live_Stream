{% extends 'layout.html' %}

{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="fas fa-lock"></i></div>
                <h1 class="h3 mb-2">Set a new password</h1>
                <p class="text-muted mb-0">Your reset link is valid for 30 minutes.</p>
            </div>
            <form method="post" action="{{ url_for('auth.reset_password', token=token) }}" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="password">New password</label>
                    <input class="form-control" id="password" name="password" type="password" minlength="8" required autocomplete="new-password">
                    <div class="form-text">Use at least 8 characters.</div>
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirm_password">Confirm password</label>
                    <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="8" required autocomplete="new-password">
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="fas fa-check me-2"></i>Update password</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
