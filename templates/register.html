{% extends 'layout.html' %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="fas fa-user-plus"></i></div>
                <h1 class="h3 mb-2">Create your account</h1>
                <p class="text-muted mb-0">Join IPL Live and keep your cricket dashboard close.</p>
            </div>
            <form method="post" novalidate>
                <div class="mb-3">
                    <label class="form-label" for="name">Full name</label>
                    <input class="form-control" id="name" name="name" type="text" required autocomplete="name">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="email">Email address</label>
                    <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" minlength="6" required autocomplete="new-password">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="confirm_password">Confirm password</label>
                    <input class="form-control" id="confirm_password" name="confirm_password" type="password" minlength="6" required autocomplete="new-password">
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="fas fa-user-plus me-2"></i>Register</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0">Already registered? <a href="{{ url_for('auth.login') }}">Log in</a></p>
        </div>
    </div>
</div>
{% endblock %}
