{% extends 'layout.html' %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <img class="auth-bat-ball-image mb-4" src="https://images.unsplash.com/photo-1531415074968-036ba1b575da?auto=format&fit=crop&w=1000&q=85" alt="Cricket bat and ball">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="fas fa-user-lock"></i></div>
                <h1 class="h3 mb-2">Welcome back</h1>
                <p class="text-muted mb-0">Sign in to your IPL Live account.</p>
            </div>
            <form method="post" novalidate>
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="mb-3">
                    <label class="form-label" for="email">Email address</label>
                    <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
                </div>
                <div class="mb-4">
                    <label class="form-label" for="password">Password</label>
                    <input class="form-control" id="password" name="password" type="password" required autocomplete="current-password">
                </div>
                <div class="text-end mb-3">
                    <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="fas fa-sign-in-alt me-2"></i>Login</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
        </div>
    </div>
</div>
{% endblock %}
