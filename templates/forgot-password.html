{% extends 'layout.html' %}

{% block title %}Forgot Password{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card card shadow-sm">
        <div class="card-body p-4 p-md-5">
            <div class="text-center mb-4">
                <div class="auth-icon"><i class="fas fa-key"></i></div>
                <h1 class="h3 mb-2">Forgot your password?</h1>
                <p class="text-muted mb-0">Enter your account email and we will send a reset link.</p>
            </div>
            <form method="post" novalidate>
                <div class="mb-4">
                    <label class="form-label" for="email">Email address</label>
                    <input class="form-control" id="email" name="email" type="email" required autocomplete="email">
                </div>
                <button class="btn btn-primary w-100" type="submit"><i class="fas fa-paper-plane me-2"></i>Send reset link</button>
            </form>
            <p class="text-center text-muted mt-4 mb-0"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
        </div>
    </div>
</div>
{% endblock %}
